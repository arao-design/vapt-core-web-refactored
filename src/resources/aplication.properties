# Nome da Aplica\u00e7\u00e3o
spring.application.name=vapt-web-spring

# Configura\u00e7\u00e3o do Banco H2 em Mem\u00f3ria
spring.datasource.url=jdbc:h2:mem:vaptdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilita o console visual do banco de dados no navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Cria e atualiza as tabelas do banco automaticamente com base nas suas classes @Entity
spring.jpa.hibernate.ddl-auto=update